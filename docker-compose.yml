services:
  app:
    image: bww01/itkapp_main:latest
    command: >
      sh -c "bun /app/scripts/migrate.ts &&
      bun .output/server/index.mjs"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://user:12345@db:5432/user_data
      ADMIN_USERS: ${ADMIN_USERS}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD}
      NUXT_JWT_SECRET: ${NUXT_JWT_SECRET}
      NUXT_JWT_EXPIRES_IN: ${NUXT_JWT_EXPIRES_IN:-8h}
      LDAP_URL: ${LDAP_URL}
      LDAP_BASE_DN: ${LDAP_BASE_DN}
      CALENDARS_DIR: /data/calendars
    volumes:
      - ./data/calendars:/data/calendars
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: user_data
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d user_data"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
  caddy_data:
  caddy_config: