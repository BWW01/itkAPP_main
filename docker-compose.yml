x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  wiki-php:
    image: php:8.3-fpm-alpine
    restart: unless-stopped
    volumes:
      - ./perpa4:/var/www/html/perpa4
    logging: *default-logging

  app:
    logging: *default-logging
    image: bww01/itkapp_main:latest
    command: >
      sh -c "bun /app/scripts/migrate.ts &&
      bun .output/server/index.mjs"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://user:${POSTGRES_PASSWORD}@db:5432/user_data
      NUXT_ADMIN_USERS: ${ADMIN_USERS}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD}
      NUXT_LDAP_URL: ${NUXT_LDAP_URL}
      NUXT_LDAP_BASE_DN: ${NUXT_LDAP_BASE_DN}
      CALENDARS_DIR: /data/calendars
    volumes:
      - ./data/calendars:/data/calendars
    depends_on:
      db:
        condition: service_healthy

  caddy:
    logging: *default-logging
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - ./perpa4:/var/www/html/perpa4
    depends_on:
      - app

  db:
    logging: *default-logging
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: user_data
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d user_data"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
  caddy_data:
  caddy_config: